[project]
name = "rtv-eval"
version = "0.1.0"
description = "Real-Time Video Understanding Evaluation Platform"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
]

[project.scripts]
rtv-eval = "rtv_eval.cli:cli"

[tool.setuptools.packages.find]
include = ["rtv_eval*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
