# RTV-Eval Experiment Configuration
# Tests multiple models x multiple video preprocessing strategies on MotionBench

name: "motionbench_baseline"
concurrency: 5
output_dir: "results"

benchmark:
  name: "motionbench"
  type: "motionbench"
  data_dir: "/Users/jielosc/Research/MotionBench/data"
  video_root: "/Users/jielosc/Research/MotionBench/hf_download/MotionBench"
  split: "dev"  # "dev" for local scoring, "test" for leaderboard submission

models:
  - name: "gpt-4o"
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"      # reads key from this env var
    model_name: "gpt-4o-2024-08-06"
    max_tokens: 256
    temperature: 0.0
    detail: "low"          # "low" saves tokens, "high" for better quality

  # Add more models:
  # - name: "qwen-vl-max"
  #   base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  #   api_key_env: "DASHSCOPE_API_KEY"
  #   model_name: "qwen-vl-max"
  #   max_tokens: 256

strategies:
  # Count-based sampling: fixed number of frames, evenly spaced
  - name: "8frames_480p"
    frame_sampling:
      mode: "count"
      count: 8
    resolution:
      mode: "preset"
      preset: "480p"

  - name: "16frames_480p"
    frame_sampling:
      mode: "count"
      count: 16
    resolution:
      mode: "preset"
      preset: "480p"

  - name: "32frames_360p"
    frame_sampling:
      mode: "count"
      count: 32
    resolution:
      mode: "preset"
      preset: "360p"

  # FPS-based sampling: simulates real-time streaming at a given frame rate
  - name: "1fps_720p"
    frame_sampling:
      mode: "fps"
      fps: 1.0
    resolution:
      mode: "preset"
      preset: "720p"

  - name: "2fps_480p"
    frame_sampling:
      mode: "fps"
      fps: 2.0
    resolution:
      mode: "preset"
      preset: "480p"

  # Content-adaptive upload: an on-device-style policy that scores per-frame
  # change on a low-res analysis stream, then uploads each 1s window at a tier
  # chosen by its (normalized) change score C in [0,1].
  #
  # Default is pure frame-difference (w_ssim: 0.0): on 300 MotionBench videos,
  # frame difference ranked windows at Spearman 0.97 vs the D+SSIM combo, so SSIM
  # is redundant for tiering and is skipped to save on-device compute. To enable
  # SSIM, set w_ssim > 0; each metric is then robust-min-max normalized with the
  # *_norm_lo/hi bounds (measured p5..p95) before weighting, so weights are real.
  - name: "adaptive_3tier"
    adaptive:
      analysis_width: 224       # low-res analysis stream (cheap to compute)
      analysis_height: 126
      analysis_fps: 8.0         # analyse 5-10 fps
      window_seconds: 1.0       # tier decision granularity
      w_frame_diff: 1.0         # weight on normalized frame difference D
      w_ssim: 0.0               # 0 => pure D, SSIM not computed; >0 => add SSIM
      smoothing: 0.0            # EMA in [0,1) to damp tier flicker; 0 disables
      # Calibration bounds (p5..p95 from 300-video measurement); used to scale
      # each metric to [0,1] before weighting. Defaults shown for transparency.
      d_norm_lo: 0.0013
      d_norm_hi: 0.0904
      s_norm_lo: 0.0040
      s_norm_hi: 0.5890
      tiers:                    # ordered low -> high change; first min_score = 0.0
        - name: "low"           # ~48% of windows
          min_score: 0.0
          fps: 1.0
          resolution: {mode: "preset", preset: "720p"}
          quality: 90
        - name: "mid"           # ~27% of windows
          min_score: 0.15
          fps: 2.0
          resolution: {mode: "preset", preset: "480p"}
          quality: 75
        - name: "high"          # ~25% of windows
          min_score: 0.40
          fps: 4.0
          resolution: {mode: "preset", preset: "360p"}
          quality: 60

